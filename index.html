<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>英檢冒險島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 版面概念：海上群島地圖。藍色海洋為底，四座島＝聽說讀寫，題目卡是白色大卡片，按鈕厚實好按（平板手指操作）。單一明亮主題。 */
:root{
  --sky:#c4ecfc; --sea:#1f93c9; --sea-deep:#0b5a86; --foam:#eaf8ff;
  --sand:#fff3d1; --card:#ffffff; --ink:#14324b; --muted:#557089; --line:#d3e4ef;
  --coral:#ff6b57; --leaf:#1fae7a; --sun:#f6a51f; --grape:#8a63f0;
  --gold:#ffc21a; --gold-dark:#c98f00;
  --good:#16a058; --good-bg:#e2f7ea; --bad:#de4148; --bad-bg:#fde7e7; --pick:#d9efff;
  --f-display:"Baloo 2","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Nunito","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r-lg:28px; --r-md:18px;
  --shadow:0 6px 0 rgba(6,52,80,.22);
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0; color:var(--ink); font:600 18px/1.5 var(--f-body);
  background-color:var(--sea-deep);
  background-image:
    radial-gradient(120px 40px at 12% 30%, rgba(255,255,255,.18), transparent 70%),
    radial-gradient(160px 50px at 80% 62%, rgba(255,255,255,.14), transparent 70%),
    radial-gradient(140px 40px at 30% 86%, rgba(255,255,255,.12), transparent 70%),
    linear-gradient(180deg,var(--sky) 0,#86d2f2 14%,var(--sea) 48%,var(--sea-deep) 100%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 40px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:rgba(255,255,255,.92);border-radius:22px;padding:8px 10px;box-shadow:var(--shadow);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:8px;font:800 22px/1 var(--f-display);margin-right:auto;min-width:0}
.brand .ship{font-size:30px}
.chip-lv{display:flex;flex-direction:column;gap:3px;min-width:128px;font-size:14px;line-height:1.1}
.chip-lv b{font-family:var(--f-display);font-size:16px}
.xpbar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--gold));border-radius:8px;transition:width .5s}
.coins{font:800 20px/1 var(--f-display);background:var(--sand);padding:9px 14px;border-radius:14px;font-variant-numeric:tabular-nums}
.tog{width:52px;height:48px;border-radius:14px;border:0;background:var(--foam);font-size:22px;position:relative}
.tog[aria-pressed="false"]{opacity:.45}
.tog[aria-pressed="false"]::after{content:"";position:absolute;left:12px;right:12px;top:50%;height:4px;background:var(--bad);transform:rotate(-35deg);border-radius:4px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:58px;padding:0 24px;border-radius:var(--r-md);border:0;
  background:var(--card);color:var(--ink);font:800 20px/1.2 var(--f-body);box-shadow:0 5px 0 rgba(6,52,80,.25);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(6,52,80,.25)}
.btn.primary{background:var(--gold);box-shadow:0 5px 0 var(--gold-dark)}
.btn.primary:active:not(:disabled){box-shadow:0 1px 0 var(--gold-dark)}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--foam)}
.btn.big{min-height:72px;font-size:26px;padding:0 40px;border-radius:24px}
.link{border:0;background:none;color:var(--sea-deep);text-decoration:underline;font-weight:800;padding:10px 4px;min-height:44px}
.play.playing .pi{animation:pulse .7s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.35)}}

/* ---------- Screens ---------- */
.panel{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:24px}
.start{display:grid;gap:22px;justify-items:center;text-align:center;padding:40px 24px;max-width:760px;margin:6vh auto 0}
.start h1{font-size:clamp(44px,8vw,76px);color:var(--sea-deep);letter-spacing:.02em}
.start .sub{font-size:22px;color:var(--muted);margin:0}
.start .isl-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.start .isl-row span{padding:10px 16px;border-radius:16px;background:var(--sand);font-weight:800;border:3px solid var(--ic)}
.tip{font-size:16px;color:var(--muted);margin:0;max-width:52ch}

.map{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}
.islands{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:6px}
.island{position:relative;border:6px solid var(--ic);background:radial-gradient(circle at 50% 38%,#fffaf0 0,var(--sand) 60%,#f6e2ad 100%);
  border-radius:46% 54% 44% 56%/52% 44% 56% 48%;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:20px 12px;
  box-shadow:0 10px 0 rgba(6,52,80,.28),0 0 0 10px rgba(255,255,255,.25);animation:bob 5s ease-in-out infinite}
.island:nth-child(2){animation-delay:-1.2s}.island:nth-child(3){animation-delay:-2.4s}.island:nth-child(4){animation-delay:-3.6s}
.island:active{transform:scale(.97)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}
.i-icon{font-size:64px;line-height:1}
.i-name{font:800 32px/1.1 var(--f-display)}
.i-en{font:800 15px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ic)}
.i-meta{margin-top:6px;font-size:16px;background:rgba(255,255,255,.8);padding:4px 12px;border-radius:12px;font-variant-numeric:tabular-nums}
.palm{position:absolute;top:8px;right:16%;font-size:30px}
.sailer{position:absolute;left:50%;top:50%;font-size:44px;translate:-50% -50%;pointer-events:none;animation:sail 7s ease-in-out infinite;z-index:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
@keyframes sail{0%,100%{transform:translateX(-14px) rotate(-6deg)}50%{transform:translateX(14px) rotate(6deg)}}
.dock{display:grid;gap:12px}
.dock-item{display:grid;grid-template-columns:56px 1fr;gap:4px 12px;align-items:center;text-align:left;border:0;background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);min-height:84px}
.dock-item:active{transform:translateY(3px)}
.dock-item .di{grid-row:span 2;font-size:40px;text-align:center}
.dock-item b{font:800 21px/1.1 var(--f-display)}
.dock-item small{font-size:15px;color:var(--muted);line-height:1.3}
.dock-item.done{background:var(--good-bg)}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar h2{font-size:34px;color:#fff;text-shadow:0 3px 0 rgba(6,52,80,.35)}
.isl-info{color:var(--muted);margin:6px 0 0;font-size:16px}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.stage{display:grid;gap:6px;text-align:left;border:0;border-radius:24px;background:var(--card);padding:20px;box-shadow:var(--shadow);border-top:10px solid var(--ic)}
.stage:active{transform:translateY(3px)}
.stage h3{font-size:26px}
.stage p{margin:0;color:var(--muted);font-size:16px}
.stars{font-size:28px;letter-spacing:2px;color:var(--gold);text-shadow:0 2px 0 var(--gold-dark)}
.stars .off{color:var(--line);text-shadow:none}
.stage.boss{background:linear-gradient(135deg,#2b2350,#3d2f7a);color:#fff;border-top-color:var(--gold)}
.stage.boss p{color:#d9d2ff}
.stage.boss.locked{filter:grayscale(.7);opacity:.75}
.boss-e{font-size:56px;line-height:1}

/* ---------- Quiz ---------- */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.qx{min-width:58px}
.prog{flex:1;min-width:140px;height:18px;border-radius:12px;background:rgba(255,255,255,.4);overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);border-radius:12px;transition:width .3s}
.hearts{font-size:28px;letter-spacing:2px}
.combo{font:800 20px/1 var(--f-display);background:var(--coral);color:#fff;padding:9px 12px;border-radius:14px}
.combo[hidden]{display:none}
.timer{font:800 22px/1 var(--f-display);background:var(--card);padding:9px 14px;border-radius:14px;font-variant-numeric:tabular-nums}
.boss-row{display:flex;align-items:center;gap:14px;background:rgba(20,20,50,.55);color:#fff;border-radius:20px;padding:10px 16px;margin-bottom:14px}
.boss-row .be{font-size:52px;line-height:1}
.boss-row .bossname{font:800 20px var(--f-display)}
.hp{height:14px;border-radius:10px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:4px}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff5b5b,#ffb347);transition:width .4s}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.qcard{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:24px;display:grid;gap:18px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qtag{background:var(--tc,var(--sea));color:#fff;font-weight:800;font-size:16px;padding:6px 14px;border-radius:12px;letter-spacing:.04em}
.qinst{color:var(--muted);font-size:17px}
.mode-note{font-size:15px;background:var(--foam);padding:8px 12px;border-radius:12px;color:var(--sea-deep)}
.prompt{font:800 26px/1.4 var(--f-display)}
.blank{display:inline-block;min-width:3.4em;border-bottom:4px solid var(--sea);margin:0 .15em;text-align:center;color:var(--sea-deep)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.opts{display:grid;gap:14px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.letters{grid-template-columns:repeat(3,1fr)}
.opts.tiles{grid-template-columns:repeat(3,1fr)}
.opt{display:flex;align-items:center;gap:14px;text-align:left;min-height:68px;padding:12px 18px;border-radius:var(--r-md);border:4px solid var(--line);background:var(--card);font:700 22px/1.3 var(--f-body);color:var(--ink);transition:transform .08s}
.opt:active:not(:disabled){transform:scale(.98)}
.opt.letter{flex-direction:column;justify-content:center;text-align:center;min-height:130px}
.ltr{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--sea);color:#fff;font:800 28px/1 var(--f-display);flex:none}
.opt.tile{flex-direction:column;justify-content:center;text-align:center;min-height:150px;gap:6px}
.opt .te{font-size:52px;line-height:1}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .ltr{background:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .ltr{background:var(--bad)}
.opt.picked{border-color:var(--sea);background:var(--pick)}
.opt:disabled{opacity:1}
.concealed{color:transparent!important;background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 20px);border-radius:8px;user-select:none;-webkit-user-select:none}

.l1grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:center}
.pic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--sand);border-radius:24px;padding:20px;min-height:220px}
.pic-emoji{font-size:84px;line-height:1.1;text-align:center}
.pic-text{font:800 44px/1 var(--f-display);background:var(--card);padding:8px 18px;border-radius:14px;border:3px dashed var(--muted)}
.clock{width:180px;height:180px}
.c-face{fill:var(--card);stroke:var(--ink);stroke-width:5}
.c-tick{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.c-num{fill:var(--ink);font:800 14px var(--f-display)}
.c-h{stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.c-m{stroke:var(--coral);stroke-width:5;stroke-linecap:round}
.c-dot{fill:var(--ink)}
.l1right{display:grid;gap:14px}

.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.doc{background:var(--sand);border-radius:20px;padding:18px 20px;font:700 19px/1.6 var(--f-body);white-space:pre-wrap;overflow-wrap:anywhere;border:3px solid #f0dca6;max-height:62vh;overflow:auto}
.doc-kind{display:inline-block;font-size:14px;font-weight:800;color:#fff;background:var(--leaf);padding:3px 10px;border-radius:10px;margin-bottom:6px;white-space:normal}
.passage{background:var(--sand);border-radius:20px;padding:18px 20px;font:700 21px/1.9 var(--f-body);border:3px solid #f0dca6}
.passage .bl{display:inline-block;min-width:4.2em;padding:0 .4em;border-radius:10px;background:var(--card);border:3px dashed var(--muted);text-align:center;line-height:1.45}
.passage .bl.cur{border-color:var(--sea);border-style:solid;background:var(--pick);animation:glow 1.2s ease-in-out infinite alternate}
.passage .bl.ok{border:3px solid var(--good);background:var(--good-bg)}
.passage .bl.no{border:3px solid var(--bad);background:var(--bad-bg)}
.passage .bl.pk{border:3px solid var(--sea);background:var(--pick)}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(31,147,201,.5)}to{box-shadow:0 0 0 6px rgba(31,147,201,0)}}
.qnum{font:800 18px var(--f-display);color:var(--muted)}

.ansline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:84px;padding:12px;border-radius:20px;border:4px dashed var(--line);background:var(--foam)}
.ansline.ok{border:4px solid var(--good);background:var(--good-bg)}
.ansline.no{border:4px solid var(--bad);background:var(--bad-bg)}
.ansline .ph{color:var(--muted);font-size:17px}
.punct{font:800 30px var(--f-display)}
.pool{display:flex;flex-wrap:wrap;gap:12px}
.chip{min-height:58px;padding:8px 18px;border-radius:16px;border:4px solid var(--line);background:var(--card);font:800 22px/1.2 var(--f-body);box-shadow:0 4px 0 var(--line)}
.chip.in{border-color:var(--sea);box-shadow:0 4px 0 var(--sea)}
.chip:disabled{opacity:.25;box-shadow:none}
.src{background:var(--sand);border-radius:16px;padding:14px 18px;font:800 22px/1.5 var(--f-body);display:grid;gap:4px}
.ta{width:100%;box-sizing:border-box;font:700 22px/1.5 var(--f-body);padding:14px 16px;border-radius:16px;border:4px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.ta:focus{border-color:var(--sea);outline:none}
.cmp{display:grid;gap:8px;background:var(--foam);border-radius:16px;padding:14px 16px}
.wcount{color:var(--muted);font-size:16px;font-variant-numeric:tabular-nums}
.panels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.panels div{position:relative;background:var(--sand);border-radius:18px;padding:22px 8px 14px;text-align:center;font-size:56px;line-height:1.1;border:3px solid #f0dca6}
.panels div::before{content:attr(data-n);position:absolute;top:6px;left:10px;font:800 16px var(--f-display);color:var(--muted)}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:12px;align-items:center;min-height:48px;padding:6px 12px;border-radius:12px;background:var(--foam);font-size:18px}
.checks input{width:28px;height:28px;flex:none}
.sample{background:var(--good-bg);border-radius:16px;padding:14px 18px;font:700 19px/1.6 var(--f-body)}

.say{font:800 28px/1.5 var(--f-display);background:var(--sand);border-radius:20px;padding:18px 22px}
.say.long{font:700 21px/1.7 var(--f-body)}
.say .w-ok{color:var(--good)}
.say .w-no{color:var(--bad);text-decoration:underline wavy}
.say.hiddentext{color:var(--muted);letter-spacing:.3em;text-align:center}
.mic{width:132px;height:132px;border-radius:50%;border:0;background:var(--grape);color:#fff;font-size:54px;box-shadow:0 7px 0 #5b3cb8;display:grid;place-items:center}
.mic.live{background:var(--coral);box-shadow:0 7px 0 #b8402f;animation:micp 1s infinite}
@keyframes micp{0%{box-shadow:0 7px 0 #b8402f,0 0 0 0 rgba(255,107,87,.6)}100%{box-shadow:0 7px 0 #b8402f,0 0 0 22px rgba(255,107,87,0)}}
.miclabel{font-size:18px;color:var(--muted)}
.live-text{min-height:48px;font-size:20px;color:var(--sea-deep);font-style:italic}
.rate3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rate3 .btn{min-height:76px;flex-direction:column;gap:2px;font-size:18px}
.rate3 .btn span{font-size:32px}

.fb{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);margin-top:16px;background:var(--card);border-radius:24px;padding:16px 20px;display:grid;gap:8px;box-shadow:0 8px 24px rgba(6,52,80,.35);border:5px solid var(--line);z-index:4}
.fb.good{border-color:var(--good)}
.fb.bad{border-color:var(--bad)}
.fb.self{border-color:var(--grape)}
.fb-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fb-title{font:800 28px/1.1 var(--f-display)}
.fb.good .fb-title{color:var(--good)}
.fb.bad .fb-title{color:var(--bad)}
.fb-coin{font:800 20px var(--f-display);background:var(--sand);padding:4px 12px;border-radius:12px}
.fb-line{font-size:18px}
.fb-script{font-size:17px;background:var(--foam);border-radius:12px;padding:8px 12px}
.fb-script summary{font-weight:800;cursor:pointer;min-height:36px;display:flex;align-items:center}
.fb-script p{margin:4px 0}
.fb-next{justify-self:end}

/* ---------- Result / lists ---------- */
.result{text-align:center;display:grid;gap:16px;justify-items:center;max-width:680px;margin:3vh auto 0;padding:34px 24px}
.result .big-e{font-size:96px;line-height:1}
.result h2{font-size:40px}
.result .stars{font-size:64px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.stats div{background:var(--foam);border-radius:16px;padding:12px 8px}
.stats b{display:block;font:800 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:15px}
.newbadge{display:inline-flex;gap:8px;align-items:center;background:var(--sand);border-radius:14px;padding:8px 14px;font-weight:800}
.score-box{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.score-box div{background:var(--foam);border-radius:18px;padding:14px}
.score-box b{display:block;font:800 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.note{font-size:15px;color:var(--muted);max-width:56ch;margin:0}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

.list{display:grid;gap:10px}
.li{display:flex;gap:12px;align-items:center;background:var(--foam);border-radius:14px;padding:10px 14px;font-size:17px}
.li .qtag{flex:none}
.li span:last-child{min-width:0;overflow-wrap:anywhere}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{background:var(--foam);border-radius:18px;padding:14px 10px;text-align:center;display:grid;gap:4px}
.badge .bi{font-size:44px;line-height:1}
.badge b{font:800 18px var(--f-display)}
.badge small{font-size:14px;color:var(--muted);line-height:1.3}
.badge.lock{opacity:.4;filter:grayscale(1)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.shop .btn{flex-direction:column;min-height:130px;gap:2px;font-size:17px}
.shop .btn .se{font-size:48px;line-height:1}
.shop .btn.on{outline:5px solid var(--leaf)}
.sec-title{font-size:26px;margin:4px 0 12px}
.stack{display:grid;gap:18px}

.speed-word{font:800 clamp(48px,8vw,80px)/1 var(--f-display);text-align:center;padding:18px 0;color:var(--sea-deep)}
.tbar{height:22px;border-radius:12px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--gold));transition:width .1s linear}
.flash-bad{animation:fbad .4s}
@keyframes fbad{0%,100%{background:var(--card)}30%{background:var(--bad-bg)}}

@media (max-width:900px){
  .map{grid-template-columns:1fr}
  .dock{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
  .split{grid-template-columns:1fr}
  .doc{max-height:none}
}
@media (max-width:640px){
  .l1grid{grid-template-columns:1fr}
  .opts.two,.opts.tiles{grid-template-columns:1fr}
  .island{min-height:170px;border-width:5px}
  .i-icon{font-size:44px}.i-name{font-size:24px}
  .islands{gap:14px}
  .panels div{font-size:38px}
  .stats{grid-template-columns:1fr 1fr 1fr}
  .brand span:last-child{display:none}
  .opt{font-size:19px}
  .prompt{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
.lvbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 auto 16px}.lv-t{font-weight:800;color:var(--ink-2,inherit);opacity:.8}.lv-btn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:150px;min-height:56px;padding:8px 16px;border-radius:16px;border:2px solid rgba(0,0,0,.12);background:rgba(255,255,255,.85);color:inherit;font:inherit;cursor:pointer}.lv-btn b{font-size:18px}.lv-btn small{font-size:13px;opacity:.75}.lv-btn.on{border-color:#ff7a59;background:#fff3e8;box-shadow:0 3px 0 #ff7a59}</style>

{title:"Star English Academy",kind:"廣告",text:"STAR ENGLISH ACADEMY\nGEPT Elementary & Intermediate classes\n◆ Small classes: no more than 12 students\n◆ Native English-speaking teachers\n◆ Free trial lesson every Saturday at 10 a.m.\n◆ Sign up with a friend and you both get NT$1,000 off!\nRegular price: NT$9,800 for 3 months",

{title:"Recycling Rules",kind:"告示",text:"APARTMENT RECYCLING RULES\nMonday & Thursday: paper and plastic\nTuesday & Friday: glass and metal cans\nWednesday: no collection\nWeekends: food waste only (7–9 p.m.)\n• Rinse all bottles and cans before recycling.\n• Fold boxes flat.\n• Anyone who breaks the rules may be fined NT$1,200.",

{title:"The Kind Bus Driver",kind:"新聞",text:"Taichung, Oct. 3 — A bus driver is being praised online for his kindness. Last Tuesday, an elderly woman got on Bus 300 but realized she had left her wallet at home. Instead of asking her to get off, driver Mr. Liao paid for her ticket with his own money. A passenger took a photo and shared the story on social media. Since then, it has been shared more than 20,000 times.",
 qs:[["What was the woman's problem?","She didn't have her wallet.","She got on the wrong bus.","She felt sick on the bus."],["What did Mr. Liao do?","He paid her fare himself.","He asked her to get off.","He drove her home."],["How did people learn about the story?","Through social media.","From a TV show.","From the bus company."]]},
{title:"Club Fair",kind:"告示",text:"JUNIOR HIGH CLUB FAIR\nDate: September 9 (Fri.), 1:00–4:00 p.m.  Place: Gym\n• Robotics Club — Learn to build and program robots. (Limit: 20 members)\n• Debate Club — Improve your speaking and thinking skills.\n• Guitar Club — Bring your own guitar.\n• Photography Club — Phones are fine; no camera needed.\nStudents must choose ONE club by September 16.",

{title:"Letter from a Pen Pal",kind:"信件",text:"Dear Yu-ting,\nThanks for your letter and the photos of Jiufen! The old streets and red lanterns look so beautiful. Here in Sydney, it's summer now, even though it's December. We celebrate Christmas at the beach with a barbecue, which might sound strange to you. Next month, my family is moving to Melbourne because my mom got a new job, so please send your next letter to my new address below.\nYour friend,\nOlivia",

const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
let vA=null,vB=null,speaking=false,speakTok=0,ttsCap=null,dict=null;
function pickVoices(){
  if(!synth) return;
  let vs=[]; try{ vs=synth.getVoices()||[]; }catch(e){}
  const en=vs.filter(v=>/^en([-_]|$)/i.test(v.lang||''));
  const us=en.filter(v=>/en[-_]US/i.test(v.lang)); const pool=us.length?us:en;
  const fem=/samantha|aria|jenny|zira|female|allison|ava|susan|karen|google us english|libby|sonia|emma|michelle|nicky|serena|moira/i;
  const mal=/daniel|alex|fred|guy|david|mark|male|tom|aaron|arthur|ryan|christopher|eric|roger|brian|andrew|reed/i;
  vA=pool.find(v=>fem.test(v.name)&&v.localService)||pool.find(v=>fem.test(v.name))||pool[0]||null;
  vB=pool.find(v=>mal.test(v.name)&&v!==vA&&v.localService)||pool.find(v=>mal.test(v.name)&&v!==vA)||pool.find(v=>v!==vA)||null;
}
if(synth){ pickVoices(); try{ synth.addEventListener('voiceschanged',pickVoices); }catch(e){ synth.onvoiceschanged=pickVoices; } }
const rate=()=>S.set.slow?.7:.92;

function sayOne(ln){
  return new Promise(res=>{
    let done=false; const fin=()=>{ if(!done){ done=true; clearTimeout(tm); res(); } };
    const tm=setTimeout(fin,1800+ln.text.length*100/rate());
    try{
      const u=new SpeechSynthesisUtterance(ln.text); u.lang='en-US';
      const v=ln.who==='B'?(vB||vA):vA; if(v) u.voice=v;
      u.rate=rate(); u.pitch=(ln.who==='B'&&!vB)?.7:1;
      u.onend=fin; u.onerror=fin; synth.speak(u);
    }catch(e){ fin(); }
  });
}
async function speak(lines,btn){
  if(typeof lines==='string') lines=[{text:lines}];

    if(synth){

  }catch(e){}

}

const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;

function recMode(){ if(recBroken) return 'self'; if(dict) return 'dictation'; if(SRC) return 'web'; return 'self'; }
function startListen(onText,onFail){
  const mode=recMode();
  if(mode==='dictation'){
    let buf='',part=''; const u1=dict.onFinal(e=>{buf+=e.text;onText(buf+' '+part);}), u2=dict.onPartial(e=>{part=e.text;onText(buf+' '+part);});
    const clean=()=>{try{u1();u2();}catch(e){}};
    dict.start({language:'en'}).catch(err=>{ clean(); const c=err&&err.code; if(c==='not_granted'||c==='unavailable') recBroken=true; onFail(c); });
    return {stop:async()=>{ try{ await dict.stop(); }catch(e){} clean(); return (buf+' '+part).trim(); }};
  }
  if(mode==='web'){
    let rec; try{ rec=new SRC(); }catch(e){ recBroken=true; return null; }
    rec.lang='en-US'; rec.interimResults=true; rec.continuous=true;
    let fin='',inter='',ended=false,endRes=null;
    rec.onresult=e=>{ fin='';inter=''; for(let i=0;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) fin+=r[0].transcript+' '; else inter+=r[0].transcript+' '; } onText(fin+inter); };
    rec.onerror=e=>{ if(['not-allowed','service-not-allowed','audio-capture','network'].includes(e.error)){ recBroken=true; onFail(e.error); } };
    rec.onend=()=>{ ended=true; if(endRes) endRes(); };
    try{ rec.start(); }catch(e){ recBroken=true; return null; }
    return {stop:()=>new Promise(res=>{ const out=()=>res((fin+inter).trim()); endRes=out; if(ended) return out(); try{ rec.stop(); }catch(e){} setTimeout(out,1800); })};
  }

const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function n2w(n){ n=+n; if(n<20) return NUMW[n]; if(n<100) return TENS[Math.floor(n/10)]+(n%10?' '+NUMW[n%10]:''); if(n<1000) return NUMW[Math.floor(n/100)]+' hundred'+(n%100?' '+n2w(n%100):''); return String(n); }
function words(s){
  return String(s).toLowerCase().replace(/[’‘]/g,"'")
    .replace(/(\d+):(\d+)/g,(m,a,b)=>' '+n2w(a)+' '+(b==='00'?'oclock':n2w(b))+' ')
    .replace(/\d+/g,m=>' '+n2w(m)+' ').replace(/'/g,'').replace(/[^a-z ]+/g,' ').split(/\s+/).filter(Boolean);
}
function compareSay(target,said){
  const pool={}; words(said).forEach(w=>{pool[w]=(pool[w]||0)+1;});
  let hit=0,all=0;
  const html=target.split(/\s+/).map(tok=>{
    const ps=words(tok); if(!ps.length) return esc(tok);
    let ok=true; ps.forEach(p=>{ all++; if(pool[p]){ pool[p]--; hit++; } else ok=false; });
    return '<span class="'+(ok?'w-ok':'w-no')+'">'+esc(tok)+'</span>';
  }).join(' ');
  return {ratio:all?hit/all:0,html};
}

function buildBank(B,lv,pre){
  const P=POOLSET[lv], G=GROUPSET[lv];
  const add=it=>{ it.id=pre+it.id; ITEMS[it.id]=it; (P[it.kind]=P[it.kind]||[]).push(it.id); return it.id; };
  (B.L1||[]).forEach((r,i)=>add({id:'L1-'+i,kind:'L1',pic:r[0],q:r[1],opts:r.slice(2)}));
  (B.L2||[]).forEach((r,i)=>add({id:'L2-'+i,kind:'L2',s:r[0],opts:r.slice(1)}));
  (B.L3||[]).forEach((r,i)=>add({id:'L3-'+i,kind:'L3',d:r.d,q:r.q,opts:r.o}));
  (B.L4||[]).forEach((r,i)=>add({id:'L4-'+i,kind:'L4',t:r.t,q:r.q,opts:r.o}));
  (B.R1||[]).forEach((r,i)=>add({id:'R1-'+i,kind:'R1',s:r[0],opts:r.slice(1,5),e:r[5]}));
  (B.R2||[]).forEach((p,g)=>{ const ids=[]; p.b.forEach((b,bi)=>ids.push(add({id:'R2-'+g+'-'+bi,kind:'R2',g,P:p,gk:pre+'R2-'+g,b:bi,opts:b,e:p.e[bi]}))); G.R2.push(ids); });
  (B.R3||[]).forEach((t,g)=>{ const ids=[]; t.qs.forEach((q,qi)=>ids.push(add({id:'R3-'+g+'-'+qi,kind:'R3',g,P:t,qi,q:q[0],opts:q.slice(1)}))); G.R3.push(ids); });
  (B.W1||[]).forEach((r,i)=>add({id:'W1-'+i,kind:'W1',chunks:r[0].split('/'),p:r[1],a:r[2]}));
  (B.W2||[]).forEach((r,i)=>add(Object.assign({kind:'W2'},r,{id:'W2-'+i})));
  (B.W3||[]).forEach((r,i)=>add(Object.assign({kind:'W3'},r,{id:'W3-'+i})));
  (B.S1||[]).forEach((t,i)=>add({id:'S1-'+i,kind:'S1',text:t}));
  (B.S2||[]).forEach((t,i)=>add({id:'S2-'+i,kind:'S2',text:t}));
  (B.S3||[]).forEach((r,i)=>add({id:'S3-'+i,kind:'S3',q:r[0],zh:r[1],sample:r[2]}));
}

const sc=id=>(S.seen[id]||0)+Math.random()*.9;
function pickIds(kind,n,trim){
  const GK=groups(kind);
  if(GROUPSET.base[kind]&&GK){
    const gs=GK.map(g=>({g,s:g.reduce((a,id)=>a+sc(id),0)/g.length})).sort((a,b)=>a.s-b.s);
    let out=[]; for(const x of gs){ if(out.length>=n) break; out=out.concat(x.g); }
    return trim?out.slice(0,n):out;
  }
  return pool(kind).map(id=>({id,s:sc(id)})).sort((a,b)=>a.s-b.s).slice(0,n).map(x=>x.id);
}

let SES=null;
function startSession(cfg){
  if(!cfg.ids.length){ renderNotebook(); return; }
  stopSpeak();
  SES=Object.assign({idx:0,correct:0,answered:0,combo:0,maxCombo:0,coins:0,res:[],fill:{},lvBefore:level(S.xp),locked:false},cfg);
  if(!('hearts' in cfg)) SES.hearts=3;
  if(SES.hearts!=null&&SES.ids.every(id=>SELF.has(ITEMS[id].kind))) SES.hearts=null;
  SES.realTotal=SES.ids.filter(id=>id!=='BREAK').length;
  show('quiz'); renderItem();
}
function heartsTxt(){ if(SES.hearts==null) return ''; let s=''; for(let i=0;i<3;i++) s+=i<SES.hearts?'❤️':'🤍'; return s; }
function renderTop(){
  const scr=$('#scr-quiz'); let top=$('.qtop',scr);
  const fresh=!top; if(fresh){ top=h('div',{class:'qtop'}); }
  top.innerHTML='';
  let armed=false; const x=h('button',{class:'btn qx',type:'button','aria-label':'離開'},'✕');
  x.addEventListener('click',()=>{ if(!armed){ armed=true; x.textContent='再按一次離開'; setTimeout(()=>{ armed=false; x.textContent='✕'; },2500); return; } quitSession(); });
  const done=SES.ids.slice(0,SES.idx).filter(id=>id!=='BREAK').length;
  top.append(x,h('div',{class:'prog','aria-label':'進度'},h('i',{style:'width:'+Math.round(done/SES.realTotal*100)+'%'})));
  if(SES.mode==='mock'){ top.append(h('div',{class:'timer',id:'mtimer'},SES.deadline?fmtTime(SES.deadline-Date.now()):'聽力')); }
  top.append(h('span',{class:'qnum',style:'color:#fff'},Math.min(done+1,SES.realTotal)+' / '+SES.realTotal));
  if(SES.hearts!=null) top.append(h('span',{class:'hearts','aria-label':'愛心'},heartsTxt()));
  const cb=h('span',{class:'combo'},'🔥 x'+SES.combo); if(SES.combo<2) cb.hidden=true; top.append(cb);
  if(fresh) scr.prepend(top);
  let br=$('.boss-row',scr);
  if(SES.mode==='boss'){
    const hp=Math.max(0,1-SES.correct/SES.realTotal);
    if(!br){ br=h('div',{class:'boss-row'}); top.after(br); }
    br.innerHTML=''; br.append(h('span',{class:'be','aria-hidden':'true'},SES.boss.e),h('div',{style:'flex:1'},h('div',{class:'bossname'},SES.boss.name),h('div',{class:'hp'},h('i',{style:'width:'+Math.round(hp*100)+'%'}))));
  }
}
function fmtTime(ms){ ms=Math.max(0,ms); const s=Math.ceil(ms/1000); return '⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function renderItem(){
  stopSpeak(); SES.locked=false;
  const it=ITEMS[SES.ids[SES.idx]], scr=$('#scr-quiz');

function endSession(){
  stopSpeak(); const s=SES; if(s.timer) clearInterval(s.timer);

  const card=h('div',{class:'panel result'}); scr.append(card);

    const l=Math.round(lc/lIds.length*120), r=Math.round(rc/rIds.length*120);

    if(pass) S.mockPass=true;
    if(!S.mockBest||l+r>S.mockBest.l+S.mockBest.r) S.mockBest={l,r};

  }else if(s.mode==='boss'){
    const win=s.hearts!==0&&ratio>=.6;

    emoji=win?'🎉':s.boss.e; title=win?'打倒'+s.boss.name+'了！':s.boss.name+'還活著…';
    card.append(h('div',{class:'big-e pop'},emoji),h('h2',null,title),h('p',{class:'note'},win?'魔王獎勵 +100 金幣！':'答對六成以上、而且愛心沒用完才能打倒魔王。'));
  }else if(s.mode==='daily'){
    const d=today();
    if(!S.daily[d]){ const y=new Date(); y.setDate(y.getDate()-1); S.streak=(S.lastDaily===today(y))?S.streak+1:1; S.lastDaily=d; S.daily[d]=1; bonus=50; }
    card.append(h('div',{class:'big-e pop'},'📅'),h('h2',null,'每日任務完成！'),h('p',{class:'note'},'已經連續 '+S.streak+' 天。明天再來，連續天數會繼續累積。'));
  }else{
    card.append(h('div',{class:'big-e pop'},'📒'),h('h2',null,'複習完成！'),h('p',{class:'note'},'答對的題目再答對一次，就會從錯題本畢業。'));
  }
  S.coins+=s.coins+bonus; save();
  const lvNow=level(S.xp);
  card.append(h('div',{class:'stats'},
    h('div',null,h('b',null,s.correct+'/'+s.realTotal),h('small',null,'答對')),
    h('div',null,h('b',null,s.maxCombo),h('small',null,'最高連擊')),
    h('div',null,h('b',null,'+'+(s.coins+bonus)),h('small',null,'金幣'))));
  if(lvNow>s.lvBefore) card.append(h('div',{class:'newbadge pop'},'⬆️ 升級了！Lv.'+lvNow+' '+TITLES[Math.min(lvNow-1,TITLES.length-1)]));
  const nb=checkBadges();
  if(nb.length) card.append(h('div',{class:'row',style:'justify-content:center'},nb.map(b=>h('span',{class:'newbadge pop'},b.i+' 新徽章：'+b.n))));
  const btns=h('div',{class:'row',style:'justify-content:center'});
  if(s.mode!=='daily'||!S.daily[today()]) btns.append(h('button',{class:'btn primary',type:'button',onclick:()=>{ sfx('tap'); startSession(s.remake()); }},s.mode==='review'?'再複習 10 題':'再玩一次'));
  else btns.append(h('button',{class:'btn primary',type:'button',onclick:()=>{ sfx('tap'); startSession(s.remake()); }},'再練 6 題'));
  btns.append(h('button',{class:'btn',type:'button',onclick:()=>{ sfx('tap'); if(s.island){ renderIsland(s.island); show('island'); } else { renderMap(); show('map'); } }},s.island?'回到島上':'回地圖'));
  card.append(btns);
  const good=s.mode==='mock'?S.mockPass:(s.hearts!==0);

function mcq(box,opts,correct,o){

function clockSVG(hh,mm){
  const P=(a,l)=>[60+Math.sin(a*Math.PI/180)*l,60-Math.cos(a*Math.PI/180)*l].map(v=>v.toFixed(1));
  let t=''; for(let i=0;i<12;i++){ const a=P(i*30,i%3?44:40), b=P(i*30,49); t+='<line class="c-tick" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"/>'; }
  [[12,0],[3,90],[6,180],[9,270]].forEach(([n,a])=>{ const p=P(a,31); t+='<text class="c-num" x="'+p[0]+'" y="'+(+p[1]+5)+'" text-anchor="middle">'+n+'</text>'; });
  const hp=P(((hh%12)+mm/60)*30,24), mp=P(mm*6,38);
  return '<svg class="clock" viewBox="0 0 120 120" role="img" aria-label="時鐘"><circle class="c-face" cx="60" cy="60" r="54"/>'+t+'<line class="c-h" x1="60" y1="60" x2="'+hp[0]+'" y2="'+hp[1]+'"/><line class="c-m" x1="60" y1="60" x2="'+mp[0]+'" y2="'+mp[1]+'"/><circle class="c-dot" cx="60" cy="60" r="5"/></svg>';
}

    if(ok){ send.disabled=true; ta.readOnly=true; return ctx.done(true,{note:'參考答案：'+esc(it.ans[0])}); }
    send.disabled=true; ta.readOnly=true; area.innerHTML='';
    area.append(h('div',{class:'cmp'},h('div',null,h('b',null,'你寫的：'),v),h('div',null,h('b',null,'參考答案：'),it.ans.join('　／　'))),
      h('p',{class:'note'},'只差大小寫或標點不算錯。如果你的句子意思和文法都跟參考答案一樣，只是寫法不同，可以按左邊的按鈕。'),
      h('div',{class:'row'},
        h('button',{class:'btn',type:'button',onclick:()=>{ area.innerHTML=''; ctx.done(true,{note:'參考答案：'+esc(it.ans[0])}); }},'✔ 我的寫法也對'),
        h('button',{class:'btn primary',type:'button',onclick:()=>{ area.innerHTML=''; ctx.done(false,{right:esc(it.ans[0])}); }},'了解了')));
  });
  setTimeout(()=>{ try{ ta.focus({preventScroll:true}); }catch(e){} },300);
};
RENDER.W3=ctx=>{
  const it=ctx.it;
  ctx.body.append(qhead(it,'看三張圖，用英文寫一段短文（建議 40 個字以上）'));

    area.append(h('b',null,'📗 範文（'+(it.sample.match(/[A-Za-z']+/g)||[]).length+' 個字）'),h('div',{class:'sample'},it.sample),

// 口說：麥克風或自我檢核
function modeNote(){ return h('div',{class:'mode-note'},recMode()==='self'?'🗣️ 自我檢核模式：這台裝置的網頁不能用麥克風辨識，請大聲說出來，再對照答案替自己打分。':'🎤 麥克風模式：按下麥克風開始說英文，說完再按一次。第一次會詢問麥克風權限。'); }
function selfRate(box,ctx,note){
  box.append(h('div',{class:'qinst'},'替自己打分：'),h('div',{class:'rate3'},
    h('button',{class:'btn',type:'button',onclick:()=>ctx.done(true,{self:true,note})},h('span',null,'😀'),'說得很順'),
    h('button',{class:'btn',type:'button',onclick:()=>ctx.done(true,{self:true,note})},h('span',null,'🙂'),'差一點點'),
    h('button',{class:'btn',type:'button',onclick:()=>ctx.done(false,{self:true,note})},h('span',null,'😅'),'再練練')));
}
function speakFlow(ctx,box,o){
  // o: {target, reveal(), score:boolean, selfLabel}
  box.innerHTML='';
  if(recMode()==='self'){
    box.append(h('button',{class:'btn primary big',type:'button',onclick:e=>{ e.currentTarget.remove(); sfx('tap'); o.reveal(); selfRate(box,ctx,o.note); }},o.selfLabel||'我說完了 ✔'));
    return;
  }
  const live=h('div',{class:'live-text'}), mic=h('button',{class:'mic',type:'button','aria-label':'開始說'},'🎤'), lbl=h('div',{class:'miclabel'},'按一下開始說');
  let L=null;
  const fallback=msg=>{ L=null; box.innerHTML=''; box.append(h('p',{class:'note'},msg||'麥克風沒辦法使用，改用自我檢核。')); recBroken=true; ctx.body.querySelectorAll('.mode-note').forEach(n=>n.replaceWith(modeNote())); speakFlow(ctx,box,o); };
  mic.addEventListener('click',async()=>{
    if(!L){
      stopSpeak(); live.textContent='';
      L=startListen(t=>{ live.textContent=t; },()=>fallback('這台裝置的麥克風辨識不能用，已改成自我檢核模式。'));
      if(!L) return fallback();
      mic.classList.add('live'); mic.textContent='⏹'; lbl.textContent='說完了就按一下';
      return;
    }
    const cur=L; L=null; mic.classList.remove('live'); mic.textContent='🎤'; lbl.textContent='辨識中…'; mic.disabled=true;
    const said=await cur.stop(); mic.disabled=false;
    if(!said){ lbl.textContent='沒聽到聲音，再按一次試試看'; return; }
    box.innerHTML='';
    if(o.score){
      const r=compareSay(o.target,said), pct=Math.round(r.ratio*100);
      o.reveal(r.html);
      ctx.done(r.ratio>=.7,{note:'我聽到：「'+esc(said)+'」・唸對 '+pct+'%'+(r.ratio>=.7?'':'（70% 以上算過關，紅色的字再練練）')});
    }else{
      o.reveal(); box.append(h('div',{class:'cmp'},h('b',null,'我聽到你說：'),said)); selfRate(box,ctx,'我聽到：「'+esc(said)+'」');
    }
  });
  box.append(h('div',{class:'row',style:'gap:20px'},mic,h('div',{style:'display:grid;gap:4px'},lbl,live)),
    h('button',{class:'link',type:'button',onclick:()=>fallback('已改成自我檢核模式。')},'麥克風不好用？改用自我檢核'));
}
RENDER.S1=ctx=>{

// ---------- 錯題本 ----------
function preview(it){ switch(it.kind){ case 'L1':case 'L3':case 'L4':case 'R3': return it.q; case 'L2': return it.s; case 'R1': return it.s; case 'R2': return it.P.title+'・第 '+(it.b+1)+' 格'; case 'W1': return it.a; case 'W2': return it.src.join(' '); default: return ''; } }
function renderNotebook(){
  const scr=$('#scr-notebook'); scr.innerHTML='';
  const ids=Object.keys(S.wrong).filter(id=>ITEMS[id]);
  scr.append(h('div',{class:'bar'},h('button',{class:'btn',type:'button',onclick:()=>{ sfx('tap'); renderMap(); show('map'); }},'← 地圖'),h('h2',null,'📒 錯題本')));
  const p=h('div',{class:'panel stack'}); scr.append(p);
  if(!ids.length){ p.append(h('p',{style:'font-size:22px;margin:0'},'目前沒有錯題，太厲害了！🎉'),h('p',{class:'note'},'答錯的題目會自動收進來，複習時再答對兩次就會畢業。')); show('notebook'); return; }
  p.append(h('div',{class:'row'},h('button',{class:'btn primary big',type:'button',onclick:()=>{ sfx('tap'); startSession(reviewCfg()); }},'開始複習（最多 10 題）'),h('span',{class:'note'},'共 '+ids.length+' 題。每題要再答對 2 次才會從錯題本畢業。')));
  const list=h('div',{class:'list'});
  ids.slice(0,40).forEach(id=>{ const it=ITEMS[id]; list.append(h('div',{class:'li'},h('span',{class:'qtag',style:'--tc:'+ISL_COLOR[it.kind[0]]},KIND[it.kind]),h('span',null,preview(it)))); });
  if(ids.length>40) list.append(h('div',{class:'note'},'…還有 '+(ids.length-40)+' 題'));
  p.append(list); show('notebook');
}

// ---------- 寶箱：等級、徽章、船塢 ----------
function renderChest(){
  const scr=$('#scr-chest'); scr.innerHTML='';
  scr.append(h('div',{class:'bar'},h('button',{class:'btn',type:'button',onclick:()=>{ sfx('tap'); renderMap(); show('map'); }},'← 地圖'),h('h2',null,'🧰 我的寶箱')));
  const lv=level(S.xp);
  const p=h('div',{class:'panel stack'}); scr.append(p);
  p.append(h('div',{class:'stats'},
    h('div',null,h('b',null,'Lv.'+lv),h('small',null,TITLES[Math.min(lv-1,TITLES.length-1)]+'・再 '+(lvXP(lv+1)-S.xp)+' 經驗升級')),
    h('div',null,h('b',null,S.total),h('small',null,'累積答對')),
    h('div',null,h('b',null,S.maxCombo),h('small',null,'最高連擊'))));
  p.append(h('h3',{class:'sec-title'},'🏅 徽章'),h('div',{class:'badges'},BADGES.map(b=>h('div',{class:'badge'+(S.badges[b.id]?'':' lock')},h('span',{class:'bi'},b.i),h('b',null,b.n),h('small',null,b.d)))));
  const shop=h('div',{class:'shop'});
  SHOP.forEach(it=>{
    const own=!!S.owned[it.e], on=S.ship===it.e;
    shop.append(h('button',{class:'btn'+(on?' on':''),type:'button',onclick:()=>{
      if(own){ S.ship=it.e; save(); sfx('tap'); renderChest(); return; }
      if(S.coins<it.p){ sfx('bad'); return; }
      S.coins-=it.p; S.owned[it.e]=1; S.ship=it.e; save(); sfx('buy'); renderChest();
    }},h('span',{class:'se'},it.e),h('span',null,it.n),h('small',null,on?'使用中':own?'點一下換上':'🪙 '+it.p)));
  });
  p.append(h('h3',{class:'sec-title'},'⚓ 船塢（用金幣換船）'),shop);
  show('chest');
}

// ---------- 單字快打 ----------
function VOC(){ return (LV()==='adv'&&typeof ADV!=='undefined'&&ADV.VOCAB)?ADV.VOCAB:BANK.VOCAB; }
function renderSpeedIntro(){
  const scr=$('#scr-speed'); scr.innerHTML='';
  scr.append(h('div',{class:'bar'},h('button',{class:'btn',type:'button',onclick:()=>{ sfx('tap'); renderMap(); show('map'); }},'← 地圖'),h('h2',null,'⚡ 單字快打')));
  scr.append(h('div',{class:'panel result'},h('div',{class:'big-e'},'⚡'),h('h2',null,'60 秒，能答對幾個？'),
    h('p',{class:'note',style:'font-size:18px'},'看英文單字（也會唸出來），選出正確的中文。答錯會扣 3 秒。'+(LV()==='adv'?'進階字表共 '+VOC().length+' 個（約八成國二、國三字，兩成高一字）。':'基礎字表共 '+VOC().length+' 個初級常見字。')),
    h('p',{class:'note'},'最佳紀錄：'+S.speedBest+' 分'),
    h('button',{class:'btn primary big',type:'button',onclick:()=>{ sfx('tap'); speedGame(); }},'開始 ▶')));
  show('speed');
}
function speedGame(){
  const scr=$('#scr-speed'); scr.innerHTML='';
  let score=0, end=Date.now()+60000, over=false, busy=false;
  const bar=h('i',{style:'width:100%'}), sc=h('span',{class:'coins'},'0 分'), word=h('div',{class:'speed-word'}), opts=h('div',{class:'opts two'});
  const card=h('div',{class:'qcard'},h('div',{class:'row'},h('div',{class:'tbar',style:'flex:1'},bar),sc),word,opts);
  scr.append(h('div',{class:'bar'},h('button',{class:'btn',type:'button',onclick:()=>{ over=true; clearInterval(tm); stopSpeak(); renderSpeedIntro(); }},'✕ 結束')),card);
  const tm=setInterval(()=>{ const left=end-Date.now(); bar.style.width=Math.max(0,left/600)+'%'; if(left<=0){ clearInterval(tm); finish(); } },100);
  let last=null;
  function q(){
    if(over) return; busy=false;
    const V=VOC(), HI=V.filter(x=>x[2]==='S'), LO=V.filter(x=>x[2]!=='S');
    let w; do{ w=(LV()==='adv'&&HI.length&&Math.random()<.2)?rnd(HI):rnd(LO.length?LO:V); }while(w===last); last=w;
    const others=shuffle(V.filter(x=>x!==w&&x[1]!==w[1])).slice(0,3);
    const all=shuffle([w].concat(others));
    word.textContent=w[0]; opts.innerHTML='';
    all.forEach(x=>opts.append(h('button',{class:'opt',type:'button',onclick:e=>{
      if(busy||over) return; busy=true;
      if(x===w){ score++; sc.textContent=score+' 分'; sfx('coin'); e.currentTarget.classList.add('right'); setTimeout(q,220); }
      else { end-=3000; sfx('bad'); e.currentTarget.classList.add('wrong'); [...opts.children].forEach((b,i)=>{ if(all[i]===w) b.classList.add('right'); }); card.classList.remove('flash-bad'); void card.offsetWidth; card.classList.add('flash-bad'); setTimeout(q,800); }
    }},x[1])));
    speak(w[0]);
  }
  function finish(){
    over=true; stopSpeak();
    const best=score>S.speedBest; if(best) S.speedBest=score; S.coins+=score*2; save();
    const nb=checkBadges(); scr.innerHTML='';
    scr.append(h('div',{class:'panel result'},h('div',{class:'big-e pop'},best?'🏆':'⚡'),h('h2',null,score+' 分'+(best?'・新紀錄！':'')),
      h('p',{class:'note',style:'font-size:18px'},'獲得 '+(score*2)+' 金幣。最佳紀錄 '+S.speedBest+' 分。'),
      nb.length?h('div',{class:'row',style:'justify-content:center'},nb.map(b=>h('span',{class:'newbadge pop'},b.i+' 新徽章：'+b.n))):null,
      h('div',{class:'row',style:'justify-content:center'},h('button',{class:'btn primary',type:'button',onclick:()=>{ sfx('tap'); speedGame(); }},'再挑戰'),h('button',{class:'btn',type:'button',onclick:()=>{ sfx('tap'); renderMap(); show('map'); }},'回地圖'))));
    renderHUD(); sfx(best?'win':'coin');
  }
  show('speed'); q();
}
